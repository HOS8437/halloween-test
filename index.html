<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Night | HOS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #29113d, #100817 65%, #050308);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
}

/* Background glow */
body::before {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: #ff6600;
    filter: blur(150px);
    opacity: 0.2;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* Main content */
.container {
    position: relative;
    z-index: 2;
    padding: 20px;
}

h1 {
    font-size: clamp(35px, 8vw, 65px);
    color: #ff8c00;
    text-shadow: 0 0 15px #ff6600,
                 0 0 40px #ff3300;
    letter-spacing: 4px;
    animation: titleGlow 2s infinite alternate;
}

.subtitle {
    margin-top: 15px;
    color: #c7b4d8;
    letter-spacing: 3px;
    font-size: 14px;
}

/* Pumpkin */
.pumpkin {
    font-size: clamp(130px, 28vw, 190px);
    margin: 30px 0;
    display: inline-block;
    filter: drop-shadow(0 0 15px #ff6600);
    animation: float 3s ease-in-out infinite,
               rotate 5s ease-in-out infinite;
    cursor: pointer;
    transition: filter 0.3s;
}

.pumpkin:hover {
    filter: drop-shadow(0 0 35px #ff8800);
}

/* Animations */
@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-25px);
    }
}

@keyframes rotate {
    0%, 100% {
        rotate: -5deg;
    }
    50% {
        rotate: 5deg;
    }
}

@keyframes titleGlow {
    from {
        text-shadow: 0 0 10px #ff6600;
    }
    to {
        text-shadow: 0 0 30px #ff3300,
                     0 0 60px #ff6600;
    }
}

/* Button */
button {
    margin-top: 20px;
    padding: 14px 30px;
    border: 1px solid #ff7900;
    border-radius: 30px;
    background: transparent;
    color: #ff9900;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff7900;
    color: black;
    box-shadow: 0 0 25px #ff7900;
}

/* Footer */
footer {
    position: fixed;
    bottom: 25px;
    width: 100%;
    color: #8b7c98;
    font-size: 13px;
    letter-spacing: 3px;
}

footer span {
    color: #ff8c00;
    font-weight: bold;
}

/* Floating particles */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ff8c00;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff6600;
    animation: rise linear infinite;
}

@keyframes rise {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>HAPPY HALLOWEEN</h1>

    <p class="subtitle">
        WELCOME TO THE NIGHT OF HORROR
    </p>

    <div class="pumpkin" onclick="scare()">
        🎃
    </div>

    <p id="message">
        Something is watching you...
    </p>

    <button onclick="scare()">
        DON'T TOUCH THE PUMPKIN
    </button>

</div>

<footer>
    CREATED WITH ♥ BY <span>HOS</span>
</footer>

<script>

// Create background particles
for (let i = 0; i < 35; i++) {
    let particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDuration =
        (Math.random() * 8 + 5) + "s";

    particle.style.animationDelay =
        Math.random() * 8 + "s";

    document.body.appendChild(particle);
}

// Pumpkin interaction
function scare() {
    const messages = [
        "BOO! 👻",
        "I AM WATCHING YOU...",
        "DON'T LOOK BEHIND YOU!",
        "HAPPY HALLOWEEN 🎃",
        "RUN WHILE YOU CAN!"
    ];

    let random = Math.floor(Math.random() * messages.length);
    
    document.getElementById("message").innerText =
        messages[random];
}

</script>

</body>
</html>
